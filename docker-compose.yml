# Pinned explicitly: the deploy job runs from a GitHub Actions workspace whose
# directory name is not this repo's, and an implicit project name would start a
# second stack that fights over port 8000.
name: global-conflict-map

services:
  # Build-container DNS: on the default bridge the daemon substitutes its own
  # fallback resolvers (8.8.8.8/8.8.4.4 here), which are unreachable on this
  # network, so any build that pip-installs stalls. `network: host` applies to the
  # *build* only — the running container keeps normal networking. Every build path
  # (CI image job, deploy.sh, cron) must use this or the deploy is the odd one out.
  web:
    build:
      context: .
      network: host
    # Named (not the default <project>-<service>) so the deploy script can tag
    # the running image as :rollback and re-create the container from it.
    image: gcm-web:${GCM_IMAGE_TAG:-local}
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      # Bind to loopback only: this app has no auth by design and must not be
      # reachable from the network. 0.0.0.0 inside the container is fine — the
      # host binding is what matters.
      - "127.0.0.1:8000:8000"
    environment:
      # /data/db, not /data: the database is a file inside the db directory, and the
      # path is the same on the host ($GCM_DATA_ROOT/db) and in the container, so a
      # backup or a `docker exec` never has to translate one to the other.
      GCM_DATABASE_URL: sqlite:////data/db/conflicts.db
    volumes:
      # One mount for all state (db/ and hf-cache/), which also means the host and
      # the container resolve HF_HOME to the identical directory.
      # GCM_DATA_ROOT lets the deploy job keep state outside the CI checkout:
      # actions/checkout runs `git clean -ffdx`, which would delete an in-tree
      # data/ directory along with the database. Local use keeps ./data.
      - ${GCM_DATA_ROOT:-./data}:/data
      # Defined once in scripts/_data-dir.sh, like the data dir: the deploy
      # checkout is disposable, so a hand edit here would vanish on redeploy.
      # Deployed config changes go through git.
      - ${GCM_CONFIG_DIR:-./config}/gdelt.yaml:/app/config/gdelt.yaml:ro
    restart: unless-stopped

  # One-shot daily pipeline. Not started by `docker compose up` (profiles);
  # run it with `docker compose run --rm pipeline`, or via host cron using
  # scripts/docker-daily.sh.
  pipeline:
    build:
      context: .
      network: host
    image: gcm-pipeline:${GCM_IMAGE_TAG:-local}
    profiles: ["tools"]
    entrypoint: ["/app/docker/pipeline-entrypoint.sh"]
    environment:
      GCM_DATABASE_URL: sqlite:////data/db/conflicts.db
    volumes:
      - ${GCM_DATA_ROOT:-./data}:/data
      # Defined once in scripts/_data-dir.sh, like the data dir: the deploy
      # checkout is disposable, so a hand edit here would vanish on redeploy.
      # Deployed config changes go through git.
      - ${GCM_CONFIG_DIR:-./config}/gdelt.yaml:/app/config/gdelt.yaml:ro
