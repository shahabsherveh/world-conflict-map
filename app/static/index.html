<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Conflict Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="/style.css?v=8">
</head>
<body>
  <div id="map"></div>
  <aside id="sidebar">
    <header>
      <h1>Global Conflict Map</h1>
      <div id="time-controls">
        <label>From <input type="date" id="start-date"></label>
        <label>To <input type="date" id="end-date"></label>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    </header>
    <details id="conflicts-panel" open>
      <summary>All conflicts <span id="conflict-count" class="muted"></span></summary>
      <ul id="conflict-list" class="conflict-list" aria-label="Conflicts in range"></ul>
    </details>
    <div id="detail"><p class="muted">Click a marker or conflict to see details.</p></div>
    <div id="edit-panel"></div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js?v=8"></script>
</body>
</html>
