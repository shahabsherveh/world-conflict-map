<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Global Conflict Map</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c0392b'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="/style.css?v=15">
</head>
<body>
  <div id="map" role="region" aria-label="Conflict map">
    <!-- Inside #map so it anchors to the map on every layout, including the
         stacked mobile layout where the sidebar sits below it. -->
    <div id="legend" role="img"
         aria-label="Bubble colour and size show how many events are clustered: blue and small means few, red and large means many. Small dots are single events.">
      <span class="legend-title" aria-hidden="true">Events per bubble</span>
      <span class="legend-row" aria-hidden="true">
        <span class="legend-tick">few</span>
        <span class="legend-bar"></span>
        <span class="legend-tick">many</span>
      </span>
      <span class="legend-key" aria-hidden="true">
        <span class="legend-dot"></span>single event
      </span>
    </div>
  </div>
  <aside id="sidebar">
    <header>
      <h1>Global Conflict Map</h1>
      <div id="time-controls">
        <label>From <input type="date" id="start-date"></label>
        <label>To <input type="date" id="end-date"></label>
      </div>
      <label id="search-wrap">
        <span class="visually-hidden">Filter conflicts</span>
        <input type="search" id="conflict-search" placeholder="Filter by name, country or headline…"
               autocomplete="off" spellcheck="false">
      </label>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    </header>
    <details id="conflicts-panel" open>
      <summary>Conflicts in view <span id="conflict-count" class="muted"></span></summary>
      <ul id="conflict-list" class="conflict-list" aria-label="Conflicts in the current map view"></ul>
    </details>
    <details id="nolocation-panel" hidden>
      <summary>No location <span id="nolocation-count" class="muted"></span></summary>
      <ul id="nolocation-list" class="conflict-list"
          aria-label="Conflicts without coordinates"></ul>
    </details>
    <div id="detail"><p class="muted">Click a marker or conflict to see details.</p></div>
    <div id="edit-panel"></div>
  </aside>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="/app.js?v=18"></script>
</body>
</html>
