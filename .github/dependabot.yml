version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"

  - package-ecosystem: npm
    directory: /tests/ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ui-test"

  # Python dependencies are not listed here on purpose: requirements.txt is
  # unpinned, so pip updates have nothing to bump. The runtime is the image's
  # business (`requirements.txt` is installed by the Dockerfile), and the tools a
  # gate depends on are pinned by hand in requirements-ci.txt so a release cannot
  # redden a green commit. Revisit only if the runtime gets a real lock file
  # (docs/ci-cd.md, "Follow-ups").
