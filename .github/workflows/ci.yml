name: CI

# Every change must clear the same bar before it can reach `main`. The gates
# mirror `scripts/ci-check.sh`, so a local run predicts the pipeline.
#
# Runs on the self-hosted runner on the app's own host: no hosted-minute cost,
# a warm uv/docker cache, and the docker build cache is shared with the stack
# the deploy job updates.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded PR push is wasted work. A push to main is not: deploy waits on
# its conclusion, so let it finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

# Note on $GITHUB_PATH: only the venv's bin directory is added there. Tool
# directories ($RUNNER_TEMP/shellcheck-*) are NOT appended, because a persistent
# PATH entry outlives the temp directory it points at — the next job then either
# gets a dangling entry or, worse, resolves a same-named binary from somewhere
# unexpected. Steps that need a downloaded tool call it by absolute path.

jobs:
  gates:
    name: gates (py3.12, shipped runtime)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # Not actions/setup-python: it has no Debian builds, and this runner is
      # Debian. See .github/actions/uv-python/action.yml.
      - uses: ./.github/actions/uv-python
        with:
          python-version: "3.12"
          venv: ${{ runner.temp }}/venv

      - name: Install runtime dependencies
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/venv/bin/python"
          # CPU wheel first, exactly like the Dockerfile: the bare `torch` line in
          # requirements.txt would otherwise pull the multi-GB CUDA build.
          "$UV_BIN" pip install --python "$py" torch --index-url https://download.pytorch.org/whl/cpu
          # Filtered list goes to RUNNER_TEMP, not the checkout: on this runner the
          # checkout may be the live project, and a killed job must not litter it.
          grep -v '^torch' requirements.txt > "$RUNNER_TEMP/requirements-no-torch.txt"
          "$UV_BIN" pip install --python "$py" -r "$RUNNER_TEMP/requirements-no-torch.txt"
          # Gate tools are pinned separately: an unpinned ruff/ty upgrade must not
          # turn an already green commit red on its own.
          "$UV_BIN" pip install --python "$py" -r requirements-ci.txt

      # Shell scripts are load-bearing (deploy/rollback, cutover, cron) and
      # actionlint only checks the `run:` blocks inside workflows. Version and
      # tarball hashes are pinned so a new release cannot redden a green commit.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: v0.11.0
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              arch=x86_64
              sha=b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
              ;;
            aarch64 | arm64)
              arch=aarch64
              sha=68a8133197a50beb8803f8d42f9908d1af1c5540d4bb05fdfca8c1fa47decefc
              ;;
            *)
              echo "::error::unsupported arch $(uname -m); add its release hash"
              exit 1
              ;;
          esac
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${arch}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/shellcheck.tar.gz" "$url"
          echo "${sha}  $RUNNER_TEMP/shellcheck.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/shellcheck.tar.gz" -C "$RUNNER_TEMP"
          echo "SHELLCHECK_BIN=$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" >> "$GITHUB_ENV"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check app tests scripts

      - name: Shellcheck
        run: |
          # Assert we run the binary we just verified: a PATH entry from an
          # earlier job pointing at a removed directory once made this step fail
          # in 0.4s with no output, which sent a whole debugging session down the
          # wrong path.
          "$SHELLCHECK_BIN" --version
          "$SHELLCHECK_BIN" -x scripts/*.sh docker/pipeline-entrypoint.sh

      - name: Markdown lint
        run: pymarkdown scan -r README.md AGENTS.md docs tests/ui/README.md tasks

      - name: Type check
        run: ty check

      - name: Tests
        run: pytest -q

      # A fresh DB from migrations catches a revision that does not apply in
      # order; the drift check catches a model change with no migration.
      - name: Migrations apply and match the models
        env:
          GCM_DATABASE_URL: sqlite:///${{ runner.temp }}/schema.db
        run: |
          rm -f "$RUNNER_TEMP/schema.db"
          alembic upgrade head
          alembic check

      # The app must import with only the shipped dependencies installed; the
      # suite stubs the model, so this is the one step that proves the wiring.
      - name: App imports
        run: python -c "import app.main, app.api.routes, app.extract.run, app.queries"

      # Second line of defence behind .gitignore. These are the "never commit"
      # entries in AGENTS.md; a tracked one is a data/secret leak.
      - name: No tracked databases or env files
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$|\.db$|(^|/)\.venv/'; then
            echo "::error::tracked artifact that must stay out of git:"
            git ls-files | grep -E '(^|/)\.env$|\.db$|(^|/)\.venv/'
            exit 1
          fi

  image:
    name: image (Dockerfile + runtime imports + HTTP)
    runs-on: self-hosted
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --tag gcm-web:ci .

      # Deploy depends on this file parsing and interpolating; a typo here would
      # only surface on the one machine that deploys.
      - name: Compose file is valid
        run: docker compose config --quiet

      # The build's whole trick is CPU-only torch; assert the wheels actually
      # import instead of trusting the pip layer's exit code.
      - name: Runtime imports
        run: |
          docker run --rm gcm-web:ci python -c "
          import alembic, fastapi, httpx, sqlalchemy, torch, transformers, yaml
          print('torch', torch.__version__)
          print('transformers', transformers.__version__)
          "

      # Serves the real entrypoint on a scratch DB: proves migrations run in the
      # image and the app answers /health before it is ever deployed.
      - name: Container serves /health
        run: |
          set -euo pipefail
          # A killed earlier run can leave this name behind.
          docker rm -f gcm-ci >/dev/null 2>&1 || true
          cid=$(docker run -d --name gcm-ci \
            -p 127.0.0.1::8000 \
            -e GCM_DATABASE_URL=sqlite:////tmp/ci.db \
            gcm-web:ci \
            sh -c 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000')
          # Inline trap: a named function here trips actionlint's shellcheck
          # "never invoked" because it only runs indirectly.
          trap 'docker rm -f gcm-ci >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$cid" 8000/tcp | head -1 | awk -F: '{print $NF}')
          base="http://127.0.0.1:${port}"
          for _ in $(seq 1 30); do
            # /health plus a real query: a static health response would pass even
            # if the migration left the schema unreadable. Body captured rather
            # than piped — `head` closing the pipe would trip `pipefail`.
            if curl -fsS "$base/health" >/dev/null 2>&1; then
              body=$(curl -fsS "$base/api/conflicts?start=1970-01-01&end=2100-01-01" \
                2>/dev/null || true)
              if [[ "$body" == \[* ]]; then
                echo "healthy on :${port}"
                exit 0
              fi
            fi
            sleep 2
          done
          echo "::error::container did not become healthy"
          docker logs "$cid"
          exit 1
