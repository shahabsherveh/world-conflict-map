[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ty.environment]
# The runtime we ship (Dockerfile). Checking against the newest interpreter
# here would accept syntax and stdlib behaviour the production image lacks.
python-version = "3.11"

[tool.ty.src]
exclude = ["app/migrations/versions/**"]

[tool.ruff]
line-length = 100
extend-exclude = ["app/migrations/versions"]

[tool.ruff.lint]
# Match the default set plus import sorting and bugbear: catches the drift the
# suite can't (unused imports, mutable defaults, silent zip truncation).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# ruff format replaces black; these match the settings black was using.
quote-style = "double"
indent-style = "space"

[project]
name = "global-conflict-map"
version = "0.1.0"
# The app targets 3.11 (Dockerfile, AGENTS.md). Declared explicitly so uv
# doesn't default the lockfile to the host's interpreter and silently exclude
# the runtime we actually ship.
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ty>=0.0.99",
]

[tool.pymarkdown]
# Markdown gate (pymarkdownlnt). GFM tables and task-list items must be enabled explicitly.
extensions.markdown-tables.enabled = true
extensions.markdown-task-list-items.enabled = true

# 100 columns for prose; commands in code blocks and table rows are exempt.
plugins.md013.line_length = 100
plugins.md013.code_blocks = false
plugins.md013.tables = false

# Off because the docs deliberately use:
# - no blank line between a heading/bold label and the list that follows (MD022/MD032)
# - bold labels as sub-headings in AGENTS.md (MD036)
# - compact `|---|` table delimiters (MD060)
# Enabling those rules would reformat every doc without changing rendered output.
plugins.md024.siblings_only = true
plugins.md022.enabled = false
plugins.md032.enabled = false
plugins.md036.enabled = false
plugins.md060.enabled = false
