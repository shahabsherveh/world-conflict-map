[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["app/migrations/versions"]

[tool.ruff.format]
# ruff format replaces black; these match the settings black was using.
quote-style = "double"
indent-style = "space"

[project]
name = "global-conflict-map"
version = "0.1.0"
# The app targets 3.11 (Dockerfile, AGENTS.md). Declared explicitly so uv
# doesn't default the lockfile to the host's interpreter and silently exclude
# the runtime we actually ship.
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ty>=0.0.99",
]
