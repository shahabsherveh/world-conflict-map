base_url: https://data.gdeltproject.org/gdeltv2
lookback_days: 1
zero_shot_threshold: 0.7
repair_locations: false
# Keep processed raw rows for this many days; 0 disables pruning.
raw_retention_days: 30
# Alert threshold for `scripts/check-pipeline.sh`: no successful run for this
# long means the map has stopped updating.
pipeline_stale_hours: 48
